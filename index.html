<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <title>Home</title>

    <link rel="stylesheet" href="css\home.css">
    <meta name="view-transition" content="same-origin">
</head>
<body>
    <div id="loader">
        <video id="loaderVideo" autoplay muted playsinline>
            <source src="pageintro.mov" type="video/quicktime">
            <source src="pageintro.webm" type="video/webm">
            Your browser does not support transparent videos.
        </video>
    </div>

    <script type="importmap">
        {
            "imports": {
            "three": "https://unpkg.com/three@0.179.1/build/three.module.js"
            }
        }   
    </script>

    <canvas id="grain"></canvas>

    <script type="module" src="javascript\grain.js"></script>


    <script>
        const video = document.getElementById('loaderVideo');
       
        video.addEventListener('ended', () => {
            window.location.href = './home';
        });


        video.addEventListener('play', () => {
            video.currentTime = 0;
        });
    </script>

</body>
</html>
