<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro CRT Shader</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            background-color: #000;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // 1. Setup Scene, Camera, Renderer
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // 2. Create a Placeholder Texture for iChannel0 (Video / Image)
        // Replaced with a generated procedural texture for demonstration
        const textureCanvas = document.createElement('canvas');
        textureCanvas.width = 512;
        textureCanvas.height = 512;
        const ctx = textureCanvas.getContext('2d');
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(0, 0, 512, 512);
        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 48px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('CRT DISPLAY', 256, 256);

        const inputTexture = new THREE.CanvasTexture(textureCanvas);
        inputTexture.wrapS = THREE.RepeatWrapping;
        inputTexture.wrapT = THREE.RepeatWrapping;

        // 3. Define Uniforms mapping to Shadertoy variables
        const uniforms = {
            iTime: { value: 0 },
            iResolution: { value: new THREE.Vector3(window.innerWidth, window.innerHeight, 1) },
            iChannel0: { value: inputTexture }
        };

        // 4. Vertex Shader (Passes full-screen quad coordinates)
        const vertexShader = `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = vec4(position, 1.0);
            }
        `;

        // 5. Fragment Shader (Your Shadertoy Code wrapped for WebGL)
        const fragmentShader = `
            uniform vec3 iResolution;
            uniform float iTime;
            uniform sampler2D iChannel0;

            float hash(float n) { return fract(sin(n) * 43758.5453123); }

            float noise(float x) {
                float i = floor(x);
                float f = fract(x);
                float u = f * f * (3.0 - 2.0 * f);
                return mix(hash(i), hash(i + 1.0), u);
            }

            float sdRoundBox(vec2 p, vec2 b, float r) {
                vec2 q = abs(p) - b + r;
                return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;
            }

            vec2 crtWarp(vec2 uv) {
                uv = uv * 2.0 - 1.0;
                vec2 offset = abs(uv.yx) / vec2(6.0, 4.0);
                uv = uv + uv * offset * offset;
                uv = uv * 0.5 + 0.5;
                return uv;
            }

            void mainImage( out vec4 fragColor, in vec2 fragCoord ) {
                float time = iTime;
                
                vec2 p = (fragCoord - 0.5 * iResolution.xy) / iResolution.y;

                vec2 screenSize = vec2(0.6, 0.4);
                float screenRadius = 0.05;

                float dScreen = sdRoundBox(p, screenSize, screenRadius);

                vec3 tvColor = vec3(0.12, 0.12, 0.12);
                tvColor -= length(p) * 0.15;
                
                float dLight = length(p - vec2(0.65, -0.35));
                if (dLight < 0.015) {
                    float blink = 0.675 + 0.325 * sin(time * 4.0); 
                    vec3 ledColor = vec3(1.0, 0.2, 0.2) * blink;
                    tvColor = mix(tvColor, ledColor, smoothstep(0.015, 0.005, dLight));
                }

                if (dScreen > 0.0) {
                    tvColor *= mix(0.1, 1.0, smoothstep(0.0, 0.05, dScreen));
                    fragColor = vec4(tvColor, 1.0);
                    return;
                }

                vec2 screenUV = (p + screenSize) / (screenSize * 2.0);
                screenUV = crtWarp(screenUV);

                if (screenUV.x < 0.0 || screenUV.x > 1.0 || screenUV.y < 0.0 || screenUV.y > 1.0) {
                    fragColor = vec4(0.02, 0.02, 0.02, 1.0);
                    return;
                }
                
                float triggerMajor = step(0.9, noise(time * 4.0)) * step(0.8, hash(time)); 
                float triggerMinor = step(0.92, hash(time * 12.0)); 

                vec2 glitchUV = screenUV;

                if (triggerMajor > 0.0) {
                    float tearOffset = hash(floor(glitchUV.y * 15.0 + time * 10.0)) * 2.0 - 1.0;
                    glitchUV.x += tearOffset * 0.15 * triggerMajor;
                }

                float vsyncTrigger = step(0.95, noise(time * 1.5));
                if (vsyncTrigger > 0.0) {
                    glitchUV.y = fract(glitchUV.y + time * 2.0);
                }

                float rgbShift = 0.002 + (0.03 * triggerMajor) + (0.01 * triggerMinor); 
                
                vec2 rOffset = vec2(rgbShift, 0.0);
                vec2 gOffset = vec2(0.0, rgbShift * 0.5);
                vec2 bOffset = vec2(-rgbShift, 0.0);

                float r = texture2D(iChannel0, glitchUV + rOffset).r;
                float g = texture2D(iChannel0, glitchUV + gOffset).g;
                float b = texture2D(iChannel0, glitchUV + bOffset).b;
                vec3 col = vec3(r, g, b);

                float staticNoise = hash(screenUV.x * 12.3 + screenUV.y * 45.6 + time * 78.9);
                col += staticNoise * 0.1;
                col = mix(col, vec3(staticNoise), triggerMinor * 0.4);

                float scanline = sin(screenUV.y * 600.0) * 0.06;
                col -= scanline;

                float shadowMask = mod(fragCoord.x, 3.0);
                if (shadowMask < 1.0) col *= vec3(1.0, 0.85, 0.85);
                else if (shadowMask < 2.0) col *= vec3(0.85, 1.0, 0.85);
                else col *= vec3(0.85, 0.85, 1.0);

                float vignette = screenUV.x * screenUV.y * (1.0 - screenUV.x) * (1.0 - screenUV.y);
                col *= clamp(pow(16.0 * vignette, 0.25), 0.0, 1.0);

                col *= 1.0 - 0.04 * sin(time * 60.0);

                fragColor = vec4(col, 1.0);
            }

            void main() {
                mainImage(gl_FragColor, gl_FragCoord.xy);
            }
        `;

        // 6. Create Mesh and Add to Scene
        const material = new THREE.ShaderMaterial({
            vertexShader: vertexShader,
            fragmentShader: fragmentShader,
            uniforms: uniforms
        });

        const geometry = new THREE.PlaneGeometry(2, 2);
        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        // 7. Render Loop
        function animate(time) {
            requestAnimationFrame(animate);
            uniforms.iTime.value = time * 0.001; // Convert to seconds
            renderer.render(scene, camera);
        }
        animate(0);

        // 8. Handle Window Resize
        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;
            renderer.setSize(width, height);
            uniforms.iResolution.value.set(width, height, 1);
        });
    </script>
</body>
</html>
